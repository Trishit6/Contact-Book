{% extends "base.html" %}


{% block content %}

<div class="form2">
    <div class="form2-body">
      <form  class="contact-form" action="{{url_for('contact.update', id=contact.id)}}" method="POST">

        <h2 class="form2-title">Contact Book</h2>
        
        <label for="name" class="form2-label">Name</label>
        <input type="text" id="name" name="name" value="{{contact.name}}" class="input-field" required>
        
        <label for="mobile" class="form2-label">Mobile No</label>
        <input type="tel" id="phone_no" name="phone_no" value="{{contact.phone_no}}" class="input-field" pattern="[0-9]{10}" required>
        
        <label for="email" class="form2-label">Email ID</label>
        <input type="email" id="email" name="email" value="{{contact.email}}" class="input-field" required>
        
        <div class="button-group">
          <button type="submit" class="button save-button">Update</button>
          
          <button type="reset" class="button delete-button" onclick="showModal()">Delete</button>
        </div>
      </form>
    </div>
  </div>
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <p>You want to delete the contact?</p>
      <div class="confirm-cancel-button">
        <form  class="contact-form" action="{{url_for('contact.delete', id=contact.id)}}">  
          <button class="confirm-btn" onclick="confirmDelete()">Yes</button>
        </form>
        <button class="cancel-btn" onclick="hideModal()">No</button>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById("confirmModal");

    function showModal() {
      modal.style.display = "block";
    }

    function hideModal() {
      modal.style.display = "none";
    }

  </script>

{% endblock%}
